<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="CEYC worship band progressions: search, transpose, build setlists and perform." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>CEYC Band Library</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('ceyc-music-library:v1') || '{}').settings || {};
        var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
